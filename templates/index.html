<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Simples com Groq</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>

    <div class="container">
        <!-- Cabeçalho com título e botão de exportar -->
        <div class="header">
            <h1>Chat com IA</h1>
            <button id="exportar-btn" title="Baixar conversa em PDF">
                📄 Exportar PDF
            </button>
        </div>

        <!-- Área do chat com rolagem -->
        <div id="chat-messages">
            <div class="mensagem bot">
                Olá! Sou sua IA assistente. Digite sua pergunta abaixo. 😊
            </div>
        </div>

        <!-- Campo de input e botão -->
        <div class="input-area">
            <input type="text" id="prompt-input" placeholder="Digite sua pergunta aqui..." autocomplete="off">
            <button id="enviar-btn">Enviar</button>
        </div>
    </div>

    <!-- Bibliotecas externas -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>

    <script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
